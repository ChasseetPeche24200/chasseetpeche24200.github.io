<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarlat Chasse et Pêche, armurerie et articles de pêche à Sarlat-la-Canéda</title>
<meta name="description" content="Sarlat Chasse et Pêche, Centre commercial du Pontet à Sarlat-la-Canéda : armurerie, armes de chasse neuves et d’occasion, munitions, réparation, matériel et articles de pêche.">
<link rel="icon" type="image/png" href="images/logo-64.png">
<link rel="apple-touch-icon" href="images/logo-180.png">
<meta property="og:title" content="Sarlat Chasse et Pêche">
<meta property="og:description" content="Armurerie et articles de pêche à Sarlat-la-Canéda, Centre commercial du Pontet.">
<meta property="og:image" content="https://chasseetpeche24200.github.io/images/logo.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head><body><div id="root"></div>
<script src="common.js"></script>
<script>
var DATA={shop:{address:'130 avenue Joséphine Baker, Centre commercial du Pontet',city:'24200 Sarlat-la-Canéda',phone:'05 53 29 55 89',email:'scpfaujanet@orange.fr',services:['Armes de chasse neuves et d’occasion','Munitions et accessoires','Réparation, entretien et réglage des armes','Matériel de pêche']},listings:[]};
function parisNow(){var p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});return{d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),m:Number(p.hour)*60+Number(p.minute)}}
function status(){var n=parisNow(),t=HOURS[n.d]||[];for(var i=0;i<t.length;i++){if(n.m>=t[i][0]&&n.m<t[i][1])return{open:true,text:'Ouvert, jusqu’à '+hm(t[i][1])};if(n.m<t[i][0])return{open:false,text:'Fermé, ouvre à '+hm(t[i][0])}}for(var k=1;k<=7;k++){var d=(n.d+k)%7;if(HOURS[d])return{open:false,text:'Fermé, ouvre '+(k===1?'demain':DAYS[d].toLowerCase())+' à '+hm(HOURS[d][0][0])}}return{open:false,text:'Fermé'}}
function hoursRows(){var n=parisNow();return [1,2,3,4,5,6,0].map(function(d){var h=HOURS[d];return '<tr class="'+(d===n.d?'today ':'')+(h?'':'off')+'"><td>'+DAYS[d]+'</td><td>'+(h?h.map(function(s){return hm(s[0])+' – '+hm(s[1])}).join(', '):'Fermé')+'</td></tr>'}).join('')}
function card(l,i){var p=l.photos||[];return '<button class="item'+(l.sold?' sold':'')+'" data-i="'+i+'"><div class="ph">'+(p.length?'<img loading="lazy" alt="'+esc(l.title)+'" src="'+img(p[0])+'">':'<div class="none">Photo à venir</div>')+(l.sold?'<span class="badge">Vendu</span>':'')+(p.length>1?'<span class="count">'+p.length+' photos</span>':'')+'</div><h3>'+esc(l.title)+'</h3><div class="meta">'+esc([l.caliber,l.condition].filter(Boolean).join(', '))+'</div>'+(!l.sold&&euro(l.price)?'<div class="price">'+euro(l.price)+'</div>':'')+'</button>'}
function render(){var s=DATA.shop,st=status(),L=DATA.listings||[],q=encodeURIComponent('Sarlat Chasse Pêche '+(s.address||'')+' '+s.city);
document.getElementById('root').innerHTML=
'<nav class="topnav"><div class="wrap"><a class="brand" href="#"><img src="images/logo-64.png" alt="" width="40" height="40"><span>Sarlat Chasse <em>&amp;</em> Pêche</span></a><div class="navlinks"><a href="#occasions">Occasions</a><a href="#infos">Horaires</a>'+(s.phone?'<a class="call" href="tel:'+esc(s.phone.replace(/\s/g,''))+'">Appeler</a>':'')+'</div></div></nav>'+
'<header class="hero"><div class="wrap hero-grid"><div><p class="kicker"><span>Chasse</span><span>Pêche</span><span>Armurerie</span></p><h1 class="mark">Sarlat<span>chasse &amp; pêche</span></h1><p class="lede">Votre magasin de chasse et de pêche au cœur du Périgord noir : armes de chasse, munitions, atelier de réparation, cannes, moulinets et articles de pêche, avec les conseils d’un armurier professionnel.</p><div class="status'+(st.open?' open':'')+'"><span class="dot"></span>'+st.text+'</div><div class="cta"><a class="btn" href="#occasions">Voir les occasions</a><a class="btn ghost" href="#infos">Horaires et accès</a></div></div><img class="hero-logo" src="images/logo.png" alt="Logo Sarlat Chasse et Pêche : un raton laveur en gilet de chasse avec un fusil et une canne à pêche" width="480" height="480"></div></header>'+
'<main><section id="occasions"><div class="wrap"><h2>Armes d’occasion</h2><p class="sub">Révisées en atelier avant la vente. Passez les voir au magasin ou appelez pour plus de détails.</p>'+(L.length?'<div class="grid">'+L.map(card).join('')+'</div>':'<div class="empty">Les annonces d’occasion seront bientôt en ligne. En attendant, venez découvrir les armes disponibles au magasin.</div>')+'<p class="notice">Les armes sont remises uniquement au magasin, sur présentation des pièces exigées par la réglementation selon leur catégorie (permis de chasser validé ou licence de tir, pièce d’identité, autorisation pour la catégorie B).</p></div></section>'+
'<section id="infos"><div class="wrap two"><div><h2>Au magasin</h2><p class="sub">Ce que vous trouverez chez nous.</p><ul class="services">'+(s.services||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div><div><h2>Horaires</h2><p class="sub">Fermé le dimanche et le lundi.</p><table class="hours">'+hoursRows()+'</table><div class="contact" style="margin-top:28px"><h3 style="font-size:22px;margin-bottom:8px">Nous trouver</h3>'+(s.address?'<p>'+esc(s.address)+'</p>':'')+'<p>'+esc(s.city)+'</p>'+(s.phone?'<p><a href="tel:'+esc(s.phone.replace(/\s/g,''))+'">'+esc(s.phone)+'</a></p>':'')+(s.email?'<p><a href="mailto:'+esc(s.email)+'">'+esc(s.email)+'</a></p>':'')+'<p style="margin-top:14px"><a class="btn small" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+q+'">Itinéraire</a></p></div></div></div></section></main>'+
'<footer><div class="wrap foot"><img src="images/logo-180.png" alt="" width="72" height="72"><div><strong>Sarlat Chasse &amp; Pêche</strong><br>Armurerie et articles de pêche<br>'+esc(s.city)+'</div></div></footer><dialog id="detail"></dialog>';
Array.prototype.forEach.call(document.querySelectorAll('.item'),function(b){b.onclick=function(){openDetail(Number(b.dataset.i))}})}
function openDetail(i){var l=DATA.listings[i],d=document.getElementById('detail'),p=l.photos||[];
d.innerHTML='<div class="dlg"><div class="dlg-head"><div><h2 style="font-size:26px">'+esc(l.title)+'</h2>'+(l.sold?'<span class="meta" style="color:var(--closed);font-weight:600">Vendu</span>':(euro(l.price)?'<div class="price">'+euro(l.price)+'</div>':''))+'</div><button class="x" aria-label="Fermer">×</button></div>'+(p.length?'<div class="gallery">'+p.map(function(f){return '<img alt="" src="'+img(f)+'">'}).join('')+'</div>'+(p.length>1?'<p class="hint">Faites glisser pour voir les autres photos.</p>':''):'')+'<dl class="facts">'+[['Calibre',l.caliber],['Catégorie',l.category],['État',l.condition]].filter(function(x){return x[1]}).map(function(x){return '<dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd>'}).join('')+'</dl>'+(l.description?'<p class="desc">'+esc(l.description)+'</p>':'')+'<p class="meta">À voir chez Sarlat Chasse &amp; Pêche, du mardi au samedi. Tél.'+esc(DATA.shop.phone)+'</p></div>';
d.querySelector('.x').onclick=function(){d.close()};d.onclick=function(e){if(e.target===d)d.close()};d.showModal()}
render();
fetch('donnees.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j){DATA=j;render()}}).catch(function(){});
setInterval(function(){var el=document.querySelector('.status');if(!el)return;var st=status();el.className='status'+(st.open?' open':'');el.innerHTML='<span class="dot"></span>'+st.text},60000);
</script></body></html>
